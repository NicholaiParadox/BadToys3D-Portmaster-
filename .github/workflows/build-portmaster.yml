name: Build PortMaster (aarch64, Debian 13 Trixie)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # Runner arm64 nativo (gratis en repositorios publicos). El contenedor
    # Debian Trixie hace que el binario use la misma glibc que dArkOS Re.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie

    steps:
      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git patch file binutils ca-certificates pkg-config \
            libsdl2-dev libasound2-dev libgles-dev libegl-dev libdrm-dev libgbm-dev

      - uses: actions/checkout@v4

      # Si subiste el source original + bt3d-portmaster.patch en la raiz del
      # repo, aplica el parche. Si ya esta aplicado, no hace nada.
      - name: Aplicar parche (si hace falta)
        run: |
          if grep -q BT3D_PLATFORM_PORTMASTER CMakeLists.txt; then
            echo "Parche ya aplicado."
          elif [ -f bt3d-portmaster.patch ]; then
            patch -p1 < bt3d-portmaster.patch
          else
            echo "Falta bt3d-portmaster.patch y el source no esta parcheado."; exit 1
          fi

      # Diagnostico: muestra que desktop.cmake del commit compilado tiene el -lm
      - name: Verificar cmake/desktop.cmake
        run: cat cmake/desktop.cmake

      - name: Configurar
        # CMAKE_C_STANDARD_LIBRARIES se agrega AL FINAL de la linea de enlazado,
        # asi que -lm funciona aunque desktop.cmake no tenga el cambio.
        run: |
          cmake -S . -B build/portmaster \
            -DBT3D_PLATFORM_PORTMASTER=ON \
            -DBT3D_FETCH_RAYLIB=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD_LIBRARIES="-lm -lpthread -ldl"

      # Comprueba que raylib se configuro con el backend SDL (no GLFW/X11).
      # Si no, falla AQUI mostrando por que, en vez de descubrirlo en la consola.
      - name: Verificar backend de raylib
        run: |
          FLAGS=build/portmaster/_deps/raylib-build/raylib/CMakeFiles/raylib.dir/flags.make
          echo "--- cache de CMake ---"
          grep -E "^(PLATFORM|GRAPHICS|OPENGL_VERSION|USE_EXTERNAL_GLFW)[:=]" build/portmaster/CMakeCache.txt || true
          echo "--- definiciones PLATFORM_* de raylib ---"
          grep -o "PLATFORM_[A-Z_0-9]*" "$FLAGS" | sort -u || true
          echo "--- menciones a SDL en la config de raylib ---"
          grep -n -i "sdl" build/portmaster/_deps/raylib-src/CMakeOptions.txt \
            build/portmaster/_deps/raylib-src/cmake/LibraryConfigurations.cmake || true
          if ! grep -q "PLATFORM_DESKTOP_SDL" "$FLAGS"; then
            echo "ERROR: raylib NO se configuro con el backend SDL"; exit 1
          fi

      - name: Compilar
        run: cmake --build build/portmaster --parallel

      - name: Informacion del binario
        run: |
          file build/portmaster/bt3d_raylib
          echo "--- backend de raylib dentro del binario ---"
          strings build/portmaster/bt3d_raylib | grep -E "DESKTOP \(|Platform backend" || true
          echo "--- librerias dinamicas ---"
          ldd build/portmaster/bt3d_raylib || true
          echo "--- glibc minima requerida ---"
          objdump -T build/portmaster/bt3d_raylib | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: bt3d_raylib-aarch64
          path: build/portmaster/bt3d_raylib
